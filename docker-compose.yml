version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: taskmanager-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: taskmanager

  backend:
    build: ./backend
    container_name: taskmanager-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: taskmanager-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.docker
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
